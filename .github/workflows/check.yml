name: Check

# On every pull request: the records are valid against their schemas and the HuMeta vocabularies,
# the website builds, and the tests pass. The website builder reads the library with the HuMeta
# Portal's code, so this checks out HuMeta's main branch too.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: JLib271/HuMeta
          path: .humeta
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (pyflakes errors and syntax)
        run: ruff check --select F,E9 scripts tests
      - name: Validate the library
        run: python scripts/validate_library.py --vocabularies .humeta/standard/humeta/vocabularies.json
      - name: Build the website and run the tests
        env:
          HUMETA_DIR: .humeta
        run: |
          python scripts/build_site.py --out _site
          python -m pytest -v

name: Release

# Packages a release of the library for archiving: push a tag v<YYYY.MM.DD> (or run this by hand with
# a version). Checks the library, writes the release files (scripts/prepare_release.py), attaches them
# to a GitHub release, and asks Software Heritage to archive the repository. Then deposit the files in
# the HuMeta Instrument Library sub-collection of the STEMEd+ Commons Library, following deposit.md in
# the release, for a permanent copy with a DOI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, a date: YYYY.MM.DD (or YYYY.MM.DD.2 for a second release that day)"
        required: true

permissions:
  contents: write

concurrency:
  group: library-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Check the version
        run: |
          V="${VERSION#v}"
          [[ "$V" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "Not a date version: $VERSION"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: JLib271/HuMeta
          path: .humeta
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate the library
        run: python scripts/validate_library.py --vocabularies .humeta/standard/humeta/vocabularies.json
      - name: Package the release
        run: python scripts/prepare_release.py --version "$V" --out _release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" --target "$GITHUB_SHA" --title "HuMeta Instrument Library $V" \
            --notes-file _release/notes.md \
            "_release/humeta-library-$V.tar.gz" "_release/humeta-library-$V.json" \
            _release/CITATION.cff _release/deposit.md
      - name: Ask Software Heritage to archive the repository
        continue-on-error: true
        run: curl -fsS -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${GITHUB_REPOSITORY}/"

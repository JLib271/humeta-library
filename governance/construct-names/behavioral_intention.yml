# Governance review of the name of the shared construct "Behavioral intention" (behavioral_intention).
# Fill in the decision below and open a pull request. See README.md in this folder.

decision:        # confirm, rename, reject, or research_more
reviewer:        # your name
reviewed_on:     # date, YYYY-MM-DD
comments: ""

# Only for rename:
agreed_name: ""
agreed_rule:     # eric, icpsr, or first_use
agreed_source: "" # the ERIC or ICPSR term, or the full citation of the first published use
agreed_link: ""   # the ERIC or ICPSR page, or the first use's DOI or address
agreed_year:     # first use only

# Only for reject:
replaced_by:     # the id of the construct to use instead, if any

# The evidence for the name as proposed (do not edit; it comes from constructs.json).
proposed:
  construct_id: behavioral_intention
  name: "Behavioral intention"
  status: proposed
  rule: "3. First published use"
  source: >-
    Fishbein, M., & Ajzen, I. (1975). Belief, attitude, intention, and behavior: An introduction to
    theory and research. Addison-Wesley.
  year: 1975
  link: ""
  notes_for_reviewers: >-
    No ERIC descriptor or ICPSR term with exactly this meaning. ERIC 'Intention' is broader. Check
    Fishbein's earlier (1960s) papers for an earlier use.
  other_names: >-
    intention; persistence intention; career intention; intent to pursue
  definition: >-
    Stated readiness or plan to perform a behavior, such as taking further courses or pursuing a
    major or career.

# Governance review of the name of the shared construct "Interest" (interest).
# Fill in the decision below and open a pull request. See README.md in this folder.

decision:        # confirm, rename, reject, or research_more
reviewer:        # your name
reviewed_on:     # date, YYYY-MM-DD
comments: ""

# Only for rename:
agreed_name: ""
agreed_rule:     # eric, icpsr, or first_use
agreed_source: "" # the ERIC or ICPSR term, or the full citation of the first published use
agreed_link: ""   # the ERIC or ICPSR page, or the first use's DOI or address
agreed_year:     # first use only

# Only for reject:
replaced_by:     # the id of the construct to use instead, if any

# The evidence for the name as proposed (do not edit; it comes from constructs.json).
proposed:
  construct_id: interest
  name: "Interest"
  status: proposed
  rule: "3. First published use"
  source: >-
    Dewey, J. (1913). Interest and effort in education. Riverside Press.
  year: 1913
  link: ""
  notes_for_reviewers: >-
    No ERIC descriptor or ICPSR term with exactly this meaning. ERIC 'Student Interests' means
    topics students are interested in, not interest as a psychological state. The
    situational/individual distinction in the definition comes later (Hidi, 1990, Review of
    Educational Research, doi:10.3102/00346543060004549).
  other_names: >-
    personal interest; situational interest; enjoyment; curiosity
  definition: >-
    Enjoyment of and desire to engage with a subject, either in the moment (situational) or as an
    enduring disposition (individual).

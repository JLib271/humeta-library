# Governance review of the name of the shared construct "Self-regulated learning" (self_regulated_learning).
# Fill in the decision below and open a pull request. See README.md in this folder.

decision:        # confirm, rename, reject, or research_more
reviewer:        # your name
reviewed_on:     # date, YYYY-MM-DD
comments: ""

# Only for rename:
agreed_name: ""
agreed_rule:     # eric, icpsr, or first_use
agreed_source: "" # the ERIC or ICPSR term, or the full citation of the first published use
agreed_link: ""   # the ERIC or ICPSR page, or the first use's DOI or address
agreed_year:     # first use only

# Only for reject:
replaced_by:     # the id of the construct to use instead, if any

# The evidence for the name as proposed (do not edit; it comes from constructs.json).
proposed:
  construct_id: self_regulated_learning
  name: "Self-regulated learning"
  status: proposed
  rule: "3. First published use"
  source: >-
    Zimmerman, B. J. (1986). Becoming a self-regulated learner: Which are the key subprocesses?
    Contemporary Educational Psychology, 11(4), 307-313.
  year: 1986
  link: "https://doi.org/10.1016/0361-476X(86)90027-5"
  notes_for_reviewers: >-
    No ERIC descriptor or ICPSR term with exactly this meaning. Introduces a 1986 special issue in
    which other articles also use the term; check for an earlier use.
  other_names: >-
    metacognition; self-regulation; metacognitive self-regulation; effort regulation; time
    management
  definition: >-
    Planning, monitoring and adjusting one's own learning, including metacognition and management of
    time and effort.
